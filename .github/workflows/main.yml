name: CI mentoria

# gatilhos
on:
 workflow_dispatch

jobs:
 tests: 

   #config do SO
   runs-on: ubuntu-latest

   #variaveis
   env:
    API_BASE_URL: 'http://localhost:3000'
    PORT: 4000

   #acoes ou passos
   steps:
     - name: Checkout do repositório
       uses: actions/checkout@v4

     - name: Instalando dependências
       uses: npm install
       
     - name: Iniciando servidor da aplicação
       uses: npm run server &

     - name: Iniciando servidor do Mock 
       uses: npm run mock-server &

     - name: Executando testes
       uses: npm cypress run 
  
   
